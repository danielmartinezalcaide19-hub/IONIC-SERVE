<ion-header>
  <ion-toolbar>
    <ion-title>Agrupaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>

    @for (agrupacion of agrupaciones; track agrupacion.nombre) {

      <ion-item>

        <ion-label>
          <h2>{{ agrupacion.nombre }}</h2>
          <p>{{ agrupacion.descripcion }}</p>
        </ion-label>

      </ion-item>

    }

  </ion-list>

</ion-content>
